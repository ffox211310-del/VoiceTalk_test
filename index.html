<!DOCTYPE html>
<html lang="ja">
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CronyGO Voice Test v0.3 - Selectable Model</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js",
    "vad-web": "https://esm.run/@ricky0123/vad-web@0.0.22"
  }
}
</script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Inter,sans-serif}
header{position:sticky;top:0;background:rgba(10,10,10,.9);backdrop-filter:blur(16px);border-bottom:1px solid #222;padding:12px 16px;z-index:10}
select{background:#1f1f1f;color:#fff;border:1px solid #333;border-radius:8px;padding:6px 10px}
#status{font-size:12px;color:#a1a1aa;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#52525b;display:inline-block} .dot.on{background:#22c55e} .dot.hear{background:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
main{max-width:720px;margin:0 auto;padding:16px 14px 120px}
.msg{max-width:80%;padding:12px 14px;border-radius:18px;font-size:14px;margin:8px 0;white-space:pre-wrap}
.user{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:6px}
.ai{background:#1a1a1a;border:1px solid #222;border-bottom-left-radius:6px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-top:1px solid #222;padding:12px}
.composer{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.inputWrap{flex:1;display:flex;align-items:center;gap:8px;height:50px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid #333}
.inputWrap input{flex:1;background:transparent;border:0;outline:0;color:#fff}
#micBtn{width:52px;height:52px;border-radius:50%;background:#1f1f1f;border:1px solid #333;color:#fff;display:grid;place-items:center;cursor:pointer}
#micBtn.on{background:#ef4444;border-color:#ef4444}
</style>
</head>
<body>
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div style="font-weight:600">Voice Test v0.3 <span style="color:#666;font-size:12px">ChatGPT級選択</span></div>
    <select id="modelSelect">
      <option value="Xenova/whisper-tiny">tiny 39MB - 最速</option>
      <option value="Xenova/whisper-base" selected>base 74MB - バランス◎ 推奨</option>
      <option value="Xenova/whisper-small">small 244MB - ChatGPT級 高精度</option>
    </select>
  </div>
  <div id="status"><span id="dot" class="dot"></span> <span id="statusText">モデル選択して初期化...</span></div>
  <div style="font-size:10px;color:#52525b;margin-top:6px">変えるのはこの1行だけ: pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { quantized: true })</div>
</header>

<main id="chat">
  <div class="msg ai">モデルを選んで「読み込み」を押してください。baseが一番バランス良いです。smallはChatGPTアプリに一番近い精度です。</div>
</main>

<footer>
  <div class="composer">
    <div class="inputWrap">
      <input id="inputEl" placeholder="モデル未読み込み" />
      <button id="sendBtn">↑</button>
    </div>
    <button id="micBtn">🎤</button>
    <button id="loadBtn" style="background:#fff;color:#000;border:0;border-radius:999px;padding:0 14px;height:52px;font-weight:600">読み込み</button>
  </div>
</footer>

<script type="module">
import * as TransformersModule from "@xenova/transformers";
import { MicVAD } from "vad-web";
const { pipeline, env } = TransformersModule;
env.allowRemoteModels = true; env.allowLocalModels = false;

const inputEl = document.getElementById('inputEl');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const loadBtn = document.getElementById('loadBtn');
const chat = document.getElementById('chat');
const statusText = document.getElementById('statusText');
const dot = document.getElementById('dot');
const modelSelect = document.getElementById('modelSelect');

let transcriber = null;
let vadInstance = null;
let isVoiceMode = false;
let isTranscribing = false;

function log(t){ statusText.textContent = t; console.log(t); }
function addMsg(text, role){
  const d = document.createElement('div'); d.className='msg '+role; d.textContent=text; chat.appendChild(d); window.scrollTo(0, document.body.scrollHeight);
}

async function loadModel(){
  const modelId = modelSelect.value;
  loadBtn.disabled = true; loadBtn.textContent = 'DL中...';
  dot.className='dot'; log(`${modelId} 読み込み中... 初回はサイズ分のDLが入ります`);
  try{
    // ★ここを変えるだけでOKな部分
    transcriber = await pipeline('automatic-speech-recognition', modelId, { quantized: true });
    log(`準備完了: ${modelId} - マイク押してOK`);
    dot.className='dot on';
    inputEl.placeholder='話すか、入力...';
    loadBtn.textContent='読込済';
  }catch(e){
    log('失敗: '+e.message); loadBtn.disabled=false; loadBtn.textContent='再試行';
  }
}

async function startVAD(){
  if(!transcriber){ alert('先にモデルを読み込んで'); return; }
  try{ const s = await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch(e){ alert('マイク許可必要: '+e.message); return; }
  isVoiceMode = true; micBtn.classList.add('on'); log('VAD待機中...');
  vadInstance = await MicVAD.new({
    positiveSpeechThreshold: 0.8, negativeSpeechThreshold: 0.6,
    onSpeechStart: ()=>{ if(!window.speechSynthesis.speaking) log('聞き取り中...'); },
    onSpeechEnd: async (audio)=>{
      if(!isVoiceMode || isTranscribing) return;
      if(window.speechSynthesis.speaking) return;
      isTranscribing = true; log(`変換中... ${(audio.length/16000).toFixed(2)}s`);
      try{
        const r = await transcriber(audio, { language: 'japanese', task: 'transcribe' });
        let text = (r.text||'').trim();
        // 幻覚フィルター
        const NG=["ご視聴ありがとう","字幕","チャンネル登録","ありがとうございました"];
        if(NG.some(w=>text.includes(w))){ log('幻覚を破棄: '+text); isTranscribing=false; log('待機中...'); return; }
        if(text.length<=1){ log('短すぎて破棄'); isTranscribing=false; log('待機中...'); return; }
        inputEl.value = text; sendMessage();
      }catch(e){ log('変換エラー: '+e.message); }finally{ isTranscribing=false; if(isVoiceMode) log('待機中...'); }
    }
  });
  vadInstance.start();
}
function stopVAD(){ isVoiceMode=false; micBtn.classList.remove('on'); if(vadInstance){ try{vadInstance.pause(); vadInstance.destroy();}catch{} vadInstance=null; } log('停止中'); }
function sendMessage(){
  const t = inputEl.value.trim(); if(!t) return;
  addMsg(t,'user'); inputEl.value='';
  setTimeout(()=>{
    const reply='こんにちは、音声テストです。聞こえていますよ！ ['+modelSelect.value.split('/')[1]+'で認識]';
    addMsg(reply,'ai');
    const u = new SpeechSynthesisUtterance('こんにちは、音声テストです。聞こえていますよ！');
    u.lang='ja-JP'; u.rate=1.1; speechSynthesis.cancel(); speechSynthesis.speak(u);
  },300);
}

loadBtn.addEventListener('click', loadModel);
micBtn.addEventListener('click', ()=> isVoiceMode ? stopVAD() : startVAD());
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } });
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
