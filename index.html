<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声文字起こし</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }
    #start {
      background: #2563eb;
      color: white;
    }
    #start:hover { background: #1d4ed8; }
    #start:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }
    #stop {
      background: #dc2626;
      color: white;
    }
    #stop:hover { background: #b91c1c; }
    #stop:disabled {
      background: #fca5a5;
      cursor: not-allowed;
    }
    #clear {
      background: #e5e7eb;
      color: #374151;
    }
    #clear:hover { background: #d1d5db; }
    #status {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }
    #transcript {
      width: 100%;
      max-width: 640px;
      min-height: 200px;
      padding: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: white;
      font-size: 1.05rem;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    .interim {
      color: #9ca3af;
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: center;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <h1>🎤 音声文字起こし</h1>

  <div class="controls">
    <button id="start">開始</button>
    <button id="stop" disabled>停止</button>
    <button id="clear">クリア</button>
  </div>

  <div id="status">待機中</div>
  <div id="transcript" contenteditable="true"></div>

  <p class="note">
    Chrome / Edge 推奨。<br>
    初回はマイクの許可が必要です。日本語で認識します。
  </p>

  <script>
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('status').textContent = 'このブラウザは音声認識に対応していません（Chrome推奨）';
      document.getElementById('start').disabled = true;
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;      // 連続認識
      recognition.interimResults = true;  // 途中結果も表示

      const startBtn = document.getElementById('start');
      const stopBtn  = document.getElementById('stop');
      const clearBtn = document.getElementById('clear');
      const status   = document.getElementById('status');
      const transcript = document.getElementById('transcript');

      let finalText = '';

      recognition.onstart = () => {
        status.textContent = '聞いています…';
        startBtn.disabled = true;
        stopBtn.disabled = false;
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          if (result.isFinal) {
            finalText += result[0].transcript;
          } else {
            interim += result[0].transcript;
          }
        }
        transcript.innerHTML = finalText +
          (interim ? `<span class="interim">${interim}</span>` : '');
      };

      recognition.onerror = (event) => {
        console.error(event.error);
        if (event.error === 'not-allowed') {
          status.textContent = 'マイクの使用が許可されていません';
        } else {
          status.textContent = 'エラー: ' + event.error;
        }
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };

      recognition.onend = () => {
        // continuous中に勝手に止まることがあるので、ボタン状態を見て再開するか判断
        if (!stopBtn.disabled) {
          // ユーザーが停止していない場合は再開
          try { recognition.start(); } catch (e) {}
        } else {
          status.textContent = '停止中';
          startBtn.disabled = false;
        }
      };

      startBtn.addEventListener('click', () => {
        finalText = transcript.innerText || '';
        recognition.start();
      });

      stopBtn.addEventListener('click', () => {
        recognition.stop();
        stopBtn.disabled = true;
        startBtn.disabled = false;
        status.textContent = '停止中';
      });

      clearBtn.addEventListener('click', () => {
        finalText = '';
        transcript.innerHTML = '';
      });
    }
  </script>
</body>
</html>
