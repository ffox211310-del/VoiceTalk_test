<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CronyGO Voice Test v0.2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0a0a0a;
  color: white;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    sans-serif;
}

header {
  padding: 16px;
  border-bottom: 1px solid #222;
  position: sticky;
  top: 0;
  background: rgba(10,10,10,.9);
  backdrop-filter: blur(16px);
  z-index: 10;
}

.title {
  font-weight: 600;
}

.version {
  color: #666;
  font-weight: 400;
}

#status {
  margin-top: 10px;
  color: #aaa;
  font-size: 13px;
}

#modelInfo {
  margin-top: 4px;
  color: #555;
  font-size: 11px;
}

main {
  max-width: 720px;
  margin: auto;
  padding: 20px 14px 130px;
}

.msg {
  max-width: 82%;
  margin: 10px 0;
  padding: 12px 14px;
  border-radius: 18px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.ai {
  background: #1a1a1a;
  border: 1px solid #292929;
  border-bottom-left-radius: 6px;
}

.user {
  margin-left: auto;
  background: white;
  color: black;
  border-bottom-right-radius: 6px;
}

footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: rgba(10,10,10,.94);
  backdrop-filter: blur(20px);
  border-top: 1px solid #222;
}

.controls {
  max-width: 720px;
  margin: auto;
  display: flex;
  gap: 10px;
  align-items: center;
}

.input {
  flex: 1;
  height: 50px;
  border-radius: 999px;
  border: 1px solid #333;
  background: #151515;
  color: white;
  padding: 0 16px;
  outline: none;
  font-size: 14px;
}

.input:focus {
  border-color: #666;
}

button {
  border: 0;
  cursor: pointer;
}

#sendBtn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 20px;
}

#micBtn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #202020;
  color: white;
  border: 1px solid #333;
  font-size: 22px;
}

#micBtn.recording {
  background: #ef4444;
}

#micBtn:disabled,
#sendBtn:disabled {
  opacity: .4;
  cursor: default;
}

.hint {
  max-width: 720px;
  margin: 7px auto 0;
  color: #666;
  font-size: 10px;
  padding-left: 4px;
}
</style>
</head>

<body>

<header>

  <div class="title">
    CronyGO Voice Test
    <span class="version">v0.2</span>
  </div>

  <div id="status">
    Whisper読み込み中...
  </div>

  <div id="modelInfo">
    Xenova/whisper-tiny
  </div>

</header>


<main id="chat">

  <div class="msg ai">
    音声入力テストです。

    マイクボタンを押すと録音開始。
    もう一度押すと録音終了。

    その後、Whisper tinyで日本語を文字起こしします。
  </div>

</main>


<footer>

  <div class="controls">

    <input
      id="inputEl"
      class="input"
      placeholder="ここに文字を入力..."
      autocomplete="off"
    >

    <button id="sendBtn">
      ↑
    </button>

    <button id="micBtn">
      🎤
    </button>

  </div>

  <div class="hint">
    Whisper tiny / Web Audio API / VADなし / HTTPS必須
  </div>

</footer>


<script type="module">

import {
  pipeline,
  env
} from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js";


/* =========================
   Transformers.js設定
========================= */

env.allowRemoteModels = true;
env.allowLocalModels = false;


/* =========================
   DOM
========================= */

const statusEl = document.getElementById("status");
const inputEl = document.getElementById("inputEl");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const chat = document.getElementById("chat");


/* =========================
   状態
========================= */

let transcriber = null;

let audioContext = null;
let mediaStream = null;
let sourceNode = null;
let processorNode = null;

let recording = false;
let audioChunks = [];


/* =========================
   メッセージ
========================= */

function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "msg " + type;

  div.textContent = text;

  chat.appendChild(div);

  window.scrollTo(
    0,
    document.body.scrollHeight
  );
}


/* =========================
   ステータス
========================= */

function setStatus(text) {

  statusEl.textContent = text;

}


/* =========================
   Whisper読み込み
========================= */

async function loadWhisper() {

  try {

    setStatus(
      "Whisper tiny 読み込み中..."
    );

    transcriber = await pipeline(
      "automatic-speech-recognition",
      "Xenova/whisper-tiny",
      {
        quantized: true
      }
    );

    setStatus(
      "準備完了。マイクを押してください"
    );

    inputEl.placeholder =
      "話すか、ここに入力...";

  }

  catch (error) {

    console.error(error);

    setStatus(
      "Whisper読み込み失敗: " +
      error.message
    );

  }

}


/* =========================
   録音開始
========================= */

async function startRecording() {

  if (!transcriber) {

    alert(
      "Whisperの読み込みがまだ終わっていません"
    );

    return;

  }


  try {

    mediaStream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });

  }

  catch (error) {

    alert(
      "マイクを使用できません。\n\n" +
      error.message
    );

    return;

  }


  audioContext =
    new AudioContext({
      sampleRate: 16000
    });


  sourceNode =
    audioContext.createMediaStreamSource(
      mediaStream
    );


  processorNode =
    audioContext.createScriptProcessor(
      4096,
      1,
      1
    );


  audioChunks = [];


  processorNode.onaudioprocess =
    function(event) {

      const input =
        event.inputBuffer.getChannelData(0);

      audioChunks.push(
        new Float32Array(input)
      );

    };


  sourceNode.connect(
    processorNode
  );


  processorNode.connect(
    audioContext.destination
  );


  recording = true;

  micBtn.classList.add("recording");

  micBtn.textContent = "⏹";

  setStatus(
    "録音中... もう一度押すと終了"
  );

}


/* =========================
   録音停止
========================= */

async function stopRecording() {

  recording = false;

  micBtn.classList.remove(
    "recording"
  );

  micBtn.textContent = "🎤";

  setStatus(
    "音声データを処理中..."
  );


  if (processorNode) {

    processorNode.disconnect();

  }


  if (sourceNode) {

    sourceNode.disconnect();

  }


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(track => track.stop());

  }


  if (audioContext) {

    await audioContext.close();

  }


  /* =====================
     Float32Arrayを結合
  ===================== */

  let totalLength = 0;

  for (const chunk of audioChunks) {

    totalLength += chunk.length;

  }


  const audio =
    new Float32Array(totalLength);


  let offset = 0;

  for (const chunk of audioChunks) {

    audio.set(
      chunk,
      offset
    );

    offset += chunk.length;

  }


  audioChunks = [];


  if (audio.length < 1000) {

    setStatus(
      "録音が短すぎます"
    );

    return;

  }


  /* =====================
     Whisper
  ===================== */

  try {

    setStatus(
      "Whisperで文字起こし中..."
    );


    const result =
      await transcriber(
        audio,
        {
          language: "japanese",
          task: "transcribe"
        }
      );


    const text =
      (result.text || "").trim();


    if (!text) {

      setStatus(
        "文字を認識できませんでした"
      );

      return;

    }


    inputEl.value = text;

    setStatus(
      "文字起こし完了"
    );


    /* 自動送信 */

    sendMessage();

  }

  catch (error) {

    console.error(error);

    setStatus(
      "文字起こし失敗: " +
      error.message
    );

  }

}


/* =========================
   送信
========================= */

function sendMessage() {

  const text =
    inputEl.value.trim();


  if (!text) return;


  addMessage(
    text,
    "user"
  );


  inputEl.value = "";


  /* 固定返答 */

  setTimeout(() => {

    const reply =
      "こんにちは、音声テストです。聞こえていますよ！";


    addMessage(
      reply,
      "ai"
    );


    /* =================
       TTS
    ================= */

    const utterance =
      new SpeechSynthesisUtterance(
        reply
      );


    utterance.lang = "ja-JP";

    utterance.rate = 1.1;


    speechSynthesis.speak(
      utterance
    );

  }, 400);

}


/* =========================
   ボタン
========================= */

micBtn.addEventListener(
  "click",
  () => {

    if (recording) {

      stopRecording();

    }
    else {

      startRecording();

    }

  }
);


sendBtn.addEventListener(
  "click",
  sendMessage
);


inputEl.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   起動
========================= */

loadWhisper();

</script>

</body>
</html>
