<!DOCTYPE html>
<html lang="ja">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CronyGO Voice Test v0.2 - Fixed for Chrome</title>
<!-- es-module-shims MUST be first -->
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js",
    "vad-web": "https://esm.run/@ricky0123/vad-web@0.0.22"
  }
}
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap');
*{box-sizing:border-box} body{margin:0;background:#0a0a0a;color:#fff;font-family:'Inter','Noto Sans JP',sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,10,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);padding:14px 16px}
#status{display:flex;gap:8px;align-items:center;font-size:12px;color:#a1a1aa;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#52525b} .dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2)} .dot.hear{background:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.2);animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
main{max-width:720px;margin:0 auto;padding:18px 14px 120px}
.msg{max-width:80%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.6;margin:10px 0;white-space:pre-wrap;word-break:break-word}
.user{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:6px}
.ai{background:#1a1a1a;border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:6px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
.composer{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.inputWrap{flex:1;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06)}
.inputWrap input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px}
#micBtn{width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:#1f1f1f;color:#e4e4e7;display:grid;place-items:center;cursor:pointer;transition:.15s}
#micBtn.on{background:#ef4444;border-color:#ef4444;color:#fff;box-shadow:0 0 0 6px rgba(239,68,68,.15),0 8px 24px rgba(239,68,68,.35)}
#micBtn:disabled{opacity:.5;pointer-events:none}
.log{font-family:monospace;font-size:10px;color:#52525b;white-space:pre-wrap;max-height:80px;overflow:auto;margin-top:8px}
</style>
</head>
<body>
<header>
  <div style="font-weight:600">CronyGO Voice Test <span style="color:#71717a">v0.2 Fixed</span> <span style="font-size:11px;color:#22c55e;margin-left:8px">Chrome推奨</span></div>
  <div id="status"><span id="dot" class="dot"></span><span id="statusText">初期化中...</span></div>
  <div class="log" id="log"></div>
</header>

<main id="chat">
  <div class="msg ai">Chromeで開いてくれてありがとう。Firefoxはtransformers.jsがコケるのでChrome/Edgeでテストしてください。マイクONでVAD+Whisperが動きます。</div>
</main>

<footer>
  <div class="composer">
    <div class="inputWrap">
      <input id="inputEl" placeholder="モデル読み込み中..." autocomplete="off" />
      <button id="sendBtn" style="width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center">↑</button>
    </div>
    <button id="micBtn" title="マイク開始">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/><path d="M19 10v1a7 7 0 0 1-14 0v-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 19v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </div>
</footer>

<script type="module">
import * as TransformersModule from "@xenova/transformers";
import { MicVAD } from "vad-web";

const { pipeline, env } = TransformersModule;
env.allowRemoteModels = true;
env.allowLocalModels = false;

const inputEl = document.getElementById('inputEl');
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const chat = document.getElementById('chat');
const statusText = document.getElementById('statusText');
const dot = document.getElementById('dot');
const logEl = document.getElementById('log');

function log(t){ console.log(t); logEl.textContent = t + "\n" + logEl.textContent.slice(0,500); }
function setStatus(t, state){ statusText.textContent = t; dot.className = 'dot' + (state ? ' '+state : ''); log(t); }

let transcriber = null;
let vadInstance = null;
let isVoiceMode = false;
let isTranscribing = false;

function addMsg(text, role){
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

async function initModel(){
  setStatus('Whisper tiny 読み込み中... (初回39MB)', '');
  try{
    
// この1行を変えるだけ
transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', { quantized: true });
    
    setStatus('準備完了 - マイクを押してください', 'on');
    inputEl.placeholder = '話すか、ここに入力...';
    log('MicVAD loaded: ' + typeof MicVAD);
  }catch(e){
    setStatus('モデル読み込み失敗: ' + e.message, '');
    log(e.stack || e.message);
  }
}

async function startVoiceMode(){
  if(!transcriber){ alert('モデル未準備'); return; }
  // Mic permission check
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t=>t.stop());
  }catch(e){
    alert('マイク許可が必要です。ブラウザのアドレスバー左の鍵マークから許可してください。\n'+e.message);
    setStatus('マイク許可なし', '');
    return;
  }

  isVoiceMode = true;
  micBtn.classList.add('on');
  setStatus('VAD初期化中...', 'hear');

  try{
    // This is the fixed part - MicVAD is directly imported, not window.vad.MicVAD
    vadInstance = await MicVAD.new({
      positiveSpeechThreshold: 0.8,
      negativeSpeechThreshold: 0.6,
      minSpeechFrames: 4,
      preSpeechPadFrames: 4,
      redemptionFrames: 10,
      onSpeechStart: ()=>{
        if(window.speechSynthesis.speaking) return;
        setStatus('聞き取り中...', 'hear');
      },
      onSpeechEnd: async (audio) => {
        if(!isVoiceMode || isTranscribing) return;
        if(window.speechSynthesis.speaking) return;
        isTranscribing = true;
        setStatus(`変換中... (${(audio.length/16000).toFixed(2)}s)`, '');
        try{
          const result = await transcriber(audio, { language: 'japanese', task: 'transcribe' });
          let text = (result.text || '').trim();
          log('Whisper result: "'+text+'"');
          if(text.length <= 1){ setStatus('待機中... (短すぎ)', 'hear'); isTranscribing=false; return; }
          inputEl.value = text;
          sendMessage();
        }catch(e){
          log('Transcribe error: '+e.message);
          setStatus('変換失敗', '');
        }finally{
          isTranscribing = false;
          if(isVoiceMode) setStatus('待機中...', 'hear');
        }
      },
      onVADMisfire: ()=>{
        setStatus('待機中... (聞き取れず)', 'hear');
      }
    });
    vadInstance.start();
    setStatus('待機中... 喋ってください', 'hear');
    log('VAD started OK');
  }catch(e){
    log('VAD start error: '+e.message + '\n' + e.stack);
    setStatus('VADエラー: '+e.message, '');
    isVoiceMode = false;
    micBtn.classList.remove('on');
  }
}

function stopVoiceMode(){
  isVoiceMode = false;
  micBtn.classList.remove('on');
  if(vadInstance){ try{ vadInstance.pause(); vadInstance.destroy(); }catch{} vadInstance=null; }
  setStatus('停止中', '');
}

function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  inputEl.value = '';
  setTimeout(async ()=>{
    const reply = 'こんにちは、音声テストです。聞こえていますよ！';
    addMsg(reply, 'ai');
    const uttr = new SpeechSynthesisUtterance(reply);
    uttr.lang = 'ja-JP'; uttr.rate = 1.1;
    uttr.onstart = ()=> setStatus('読み上げ中...', '');
    uttr.onend = ()=> { if(isVoiceMode) setStatus('待機中...', 'hear'); };
    speechSynthesis.cancel();
    speechSynthesis.speak(uttr);
  }, 300);
}

micBtn.addEventListener('click', ()=>{ if(isVoiceMode) stopVoiceMode(); else startVoiceMode(); });
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } });

initModel();
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
