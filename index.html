<!DOCTYPE html>
<html lang="en">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React Artifact</title>
  <style>*,:after,:before{box-sizing:border-box;border:0 solid #e5e7eb}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#root,body,html{min-height:100%}</style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // ---- FIXED LOADER SECTION ----
    // This file is a slimmed-down, functionally-equivalent reconstruction of the
    // uploaded artifact's app-level script, with the two import-map fixes applied:
    //  1) The dynamically-injected <script type="importmap"> is now
    //     type="importmap-shim" so es-module-shims actually manages it
    //     (native import maps added after module execution has begun are ignored).
    //  2) The dynamic import now uses window.importShim(...) instead of the
    //     native import(...), and waits for importShim to exist before calling it.
    import React from "https://esm.sh/react@18.3.1";
    import ReactDOM from "https://esm.sh/react-dom@18.3.1/client";

    const e = React.createElement;

    function loadScript(src, id) {
      return new Promise((resolve, reject) => {
        const existing = document.getElementById(id);
        if (existing) {
          if (existing._loaded) return resolve();
          existing.addEventListener("load", () => resolve());
          existing.addEventListener("error", reject);
          if (existing.src) return;
        }
        const s = document.createElement("script");
        s.id = id;
        s.src = src;
        s.async = true;
        s._loaded = false;
        s.onload = () => { s._loaded = true; resolve(); };
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function ensureShimsAndImportMap() {
      if (!document.getElementById("es-module-shims")) {
        const s = document.createElement("script");
        s.id = "es-module-shims";
        s.async = true;
        s.src = "https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js";
        document.head.appendChild(s);
        await new Promise((resolve, reject) => {
          s.onload = () => resolve();
          s.onerror = reject;
        });
      }

      let mapTag = document.getElementById("transformers-importmap");
      if (!mapTag) {
        mapTag = document.createElement("script");
        // FIX #1: use "importmap-shim" (not the native "importmap") so a
        // map injected after module execution has started is still honored,
        // and point at the actual browser build file, not the bare package root.
        mapTag.type = "importmap-shim";
        mapTag.id = "transformers-importmap";
        mapTag.textContent = JSON.stringify({
          imports: {
            "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.min.js"
          }
        });
        document.head.appendChild(mapTag);
        // give the shim a beat to register the map
        await new Promise((resolve) => setTimeout(resolve, 150));
      }

      // FIX #2 (part A): wait for window.importShim to actually exist before using it.
      for (let i = 0; i < 50 && !window.importShim; i++) {
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
      if (!window.importShim) {
        throw new Error("es-module-shims failed to initialize (window.importShim not found)");
      }
    }

    async function ensureVad() {
      if (globalThis.vad || window.vad) return;
      await loadScript(
        "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.22/dist/bundle.min.js",
        "vad-web-bundle"
      );
      for (let i = 0; i < 30; i++) {
        if (window.vad) break;
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
    }

    const FIXED_REPLY = "こんにちは、音声テストです。聞こえていますよ！";

    function App() {
      const [messages, setMessages] = React.useState([
        { role: "ai", text: "テスト準備完了。マイクボタンを押して話しかけてみてください。", time: "now" }
      ]);
      const [input, setInput] = React.useState("");
      const [state, setState] = React.useState("idle"); // idle | listening | hearing | transcribing | speaking | loading_model
      const [statusLabel, setStatusLabel] = React.useState("モデル準備中...");
      const [micOn, setMicOn] = React.useState(false);
      const [ready, setReady] = React.useState(false);
      const [debug, setDebug] = React.useState("初期化中...");

      const pipelineRef = React.useRef(null);
      const vadRef = React.useRef(null);
      const bottomRef = React.useRef(null);
      const speakingRef = React.useRef(false);
      const micOnRef = React.useRef(false);

      React.useEffect(() => { micOnRef.current = micOn; }, [micOn]);
      React.useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, state]);

      React.useEffect(() => {
        let cancelled = false;

        (async () => {
          try {
            setState("loading_model");
            setStatusLabel("Whisper tiny 読み込み中...");
            setDebug("shim + importmap + vad-web 準備中...");

            await ensureShimsAndImportMap();
            if (cancelled) return;

            await ensureVad();
            if (cancelled) return;

            setDebug("Xenova/transformers 読み込み中...");

            // FIX #2 (part B): use the shim's dynamic import, not the native one,
            // so the bare specifier "@xenova/transformers" resolves via the
            // importmap-shim entry registered above.
            const mod = await window.importShim("@xenova/transformers");
            const pipeline = mod.pipeline || mod.default?.pipeline;
            const env = mod.env || mod.default?.env;
            if (env) {
              env.allowLocalModels = false;
              env.allowRemoteModels = true;
            }
            if (!pipeline) throw new Error("pipeline not found in @xenova/transformers");

            setDebug("Xenova/whisper-tiny ダウンロード中... (初回 40MB前後)");
            const asr = await pipeline("automatic-speech-recognition", "Xenova/whisper-tiny", {
              quantized: true
            });
            if (cancelled) return;

            pipelineRef.current = asr;
            setReady(true);
            setState("idle");
            setStatusLabel("待機中...");
            setDebug("準備完了。マイクONでVAD待機が始まります。");
          } catch (err) {
            console.error(err);
            setDebug(`モデル読み込み失敗: ${err?.message || err}`);
            setStatusLabel("読み込み失敗");
            setState("idle");
          }
        })();

        return () => { cancelled = true; try { vadRef.current?.destroy(); } catch {} };
      }, []);

      const pushMessage = (role, text) => {
        const time = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
        setMessages((prev) => [...prev, { role, text, time }]);
      };

      const speakFixedReply = async () => {
        if (speakingRef.current) return;
        speakingRef.current = true;
        setState("speaking");
        setStatusLabel("AI応答中...");
        try { vadRef.current?.pause(); } catch {}

        return new Promise((resolve) => {
          const utter = new SpeechSynthesisUtterance(FIXED_REPLY);
          utter.lang = "ja-JP";
          utter.rate = 1.1;
          utter.pitch = 1;
          const voices = window.speechSynthesis.getVoices();
          const jaVoice = voices.find((v) => v.lang.startsWith("ja")) || voices[0];
          if (jaVoice) utter.voice = jaVoice;

          const done = () => {
            speakingRef.current = false;
            setState(micOnRef.current ? "listening" : "idle");
            setStatusLabel("待機中...");
            try { if (micOnRef.current) vadRef.current?.start(); } catch {}
            resolve();
          };
          utter.onend = done;
          utter.onerror = done;
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(utter);
        });
      };

      const sendMessage = async (overrideText) => {
        const text = (overrideText ?? input).trim();
        if (!text) return;
        pushMessage("user", text);
        setInput("");
        setTimeout(async () => {
          pushMessage("ai", FIXED_REPLY);
          await speakFixedReply();
        }, 400);
      };

      const toggleMic = async () => {
        if (!ready) {
          setDebug("モデルがまだ準備中です。少し待ってください。");
          return;
        }
        if (micOn) {
          setMicOn(false);
          micOnRef.current = false;
          try {
            await vadRef.current?.pause();
            vadRef.current?.destroy();
          } catch {}
          vadRef.current = null;
          setState("idle");
          setStatusLabel("待機中...");
          setDebug("VAD停止");
          return;
        }

        try {
          setMicOn(true);
          micOnRef.current = true;
          setState("listening");
          setStatusLabel("待機中... (話しかけてください)");
          setDebug("マイク許可要求中...");

          const myVad = await window.vad.MicVAD.new({
            positiveSpeechThreshold: 0.75,
            negativeSpeechThreshold: 0.35,
            minSpeechFrames: 6,
            preSpeechPadFrames: 5,
            redemptionFrames: 8,
            onSpeechStart: () => {
              if (speakingRef.current) return;
              setState("hearing");
              setStatusLabel("聞き取り中...");
            },
            onSpeechEnd: async (audio) => {
              if (speakingRef.current) return;
              if (!pipelineRef.current) return;
              if (!micOnRef.current) return;

              setState("transcribing");
              setStatusLabel("変換中...");
              setDebug(`音声 ${(audio.length / 16000).toFixed(2)}s をWhisperで変換中...`);

              try {
                const result = await pipelineRef.current(audio, {
                  language: "japanese",
                  task: "transcribe",
                  chunk_length_s: 30
                });
                let text = "";
                if (typeof result === "string") text = result;
                else if (result?.text) text = result.text;
                text = text.trim();
                setDebug(`変換結果: "${text}"`);

                if (text.length < 1) {
                  setState("listening");
                  setStatusLabel("待機中... (聞き取れませんでした)");
                  setTimeout(() => setStatusLabel("待機中..."), 1200);
                  return;
                }

                const inputEl = document.getElementById("inputEl");
                if (inputEl) inputEl.value = text;
                setInput(text);
                setTimeout(() => sendMessage(text), 50);
              } catch (err) {
                console.error(err);
                setDebug(`変換エラー: ${err?.message || err}`);
                setState("listening");
                setStatusLabel("待機中...");
              }
            },
            onVADMisfire: () => {
              if (speakingRef.current) return;
              setState("listening");
              setStatusLabel("待機中...");
            }
          });

          vadRef.current = myVad;
          myVad.start();
          setDebug("VAD待機開始。喋ると自動で送信されます。");
        } catch (err) {
          console.error(err);
          setDebug(`マイク開始失敗: ${err?.message || err}. HTTPSとマイク許可を確認してください。`);
          setMicOn(false);
          setState("idle");
          setStatusLabel("マイクエラー");
        }
      };

      React.useEffect(() => {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }, []);

      const isListeningLike = state === "listening" || state === "hearing";
      const isBusy = state === "transcribing" || state === "speaking" || state === "loading_model";

      return e("div", {
        style: {
          minHeight: "100dvh",
          background: "#0a0a0a",
          color: "#f4f4f5",
          display: "flex",
          flexDirection: "column",
          fontFamily: 'Inter, ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif'
        }
      },
        e("header", { style: { borderBottom: "1px solid rgba(255,255,255,0.08)", padding: "16px" } },
          e("h1", { style: { fontSize: 15, fontWeight: 600, margin: 0 } }, "CronyGO Voice Test v0.1"),
          e("p", { style: { fontSize: 11, color: "#71717a", margin: "4px 0 0" } }, "VAD + Whisper Tiny Test")
        ),
        e("div", { style: { padding: "12px 16px", fontSize: 11, color: "#a1a1aa" } },
          e("span", null, statusLabel), " · ", e("span", null, debug)
        ),
        e("main", { style: { flex: 1, padding: "16px", paddingBottom: 120 } },
          messages.map((m, i) =>
            e("div", {
              key: i,
              style: {
                display: "flex",
                justifyContent: m.role === "user" ? "flex-end" : "flex-start",
                marginBottom: 12
              }
            },
              e("div", {
                style: {
                  maxWidth: "70%",
                  borderRadius: 18,
                  padding: "10px 14px",
                  fontSize: 13.5,
                  lineHeight: 1.6,
                  background: m.role === "user" ? "#fff" : "#1a1a1a",
                  color: m.role === "user" ? "#000" : "#f4f4f5",
                  border: m.role === "user" ? "none" : "1px solid rgba(255,255,255,0.08)"
                }
              },
                e("div", { style: { whiteSpace: "pre-wrap" } }, m.text),
                e("div", { style: { fontSize: 10, color: "#71717a", marginTop: 6 } }, m.time)
              )
            )
          ),
          e("div", { ref: bottomRef })
        ),
        e("footer", {
          style: {
            position: "fixed", bottom: 0, left: 0, right: 0,
            borderTop: "1px solid rgba(255,255,255,0.08)",
            background: "rgba(10,10,10,0.9)",
            padding: 12, display: "flex", gap: 10, alignItems: "center"
          }
        },
          e("input", {
            id: "inputEl",
            value: input,
            onChange: (ev) => setInput(ev.target.value),
            onKeyDown: (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendMessage(); } },
            placeholder: ready ? "話すか、ここに入力..." : "モデル読み込み中...",
            style: {
              flex: 1, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.1)",
              borderRadius: 999, padding: "12px 16px", color: "#f4f4f5", outline: "none", fontSize: 14
            }
          }),
          e("button", {
            onClick: () => sendMessage(),
            disabled: !input.trim(),
            style: {
              height: 40, width: 40, borderRadius: "50%", background: "#fff", color: "#000",
              border: "none", opacity: input.trim() ? 1 : 0.3
            }
          }, "→"),
          e("button", {
            onClick: toggleMic,
            disabled: state === "loading_model",
            style: {
              height: 48, width: 48, borderRadius: "50%",
              background: micOn ? "#ef4444" : "#1f1f1f",
              color: micOn ? "#fff" : "#d4d4d8",
              border: "1px solid rgba(255,255,255,0.1)",
              opacity: state === "loading_model" ? 0.5 : 1
            }
          }, micOn ? "■" : "●")
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
