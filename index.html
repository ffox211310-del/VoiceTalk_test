<!DOCTYPE html>
<html lang="ja">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CronyGO Voice Final v3 - Echo + Dedup</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(16px);border-bottom:1px solid #222;padding:12px 16px}
#status{font-size:12px;color:#a1a1aa;margin-top:8px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:#52525b} .dot.on{background:#22c55e} .dot.hear{background:#ef4444;animation:pulse 1s infinite} .dot.speak{background:#8b5cf6}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
main{flex:1;max-width:720px;width:100%;margin:0 auto;padding:16px 14px 130px}
.msg{max-width:82%;padding:12px 14px;border-radius:18px;font-size:14px;margin:8px 0;white-space:pre-wrap}
.user{margin-left:auto;background:#fff;color:#000;border-bottom-right-radius:6px}
.ai{background:#1a1a1a;border:1px solid #222;border-bottom-left-radius:6px}
#transcriptBox{margin-top:12px;padding:12px;border-radius:12px;background:#111;border:1px solid #222;min-height:56px;font-size:13px}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.92);backdrop-filter:blur(20px);border-top:1px solid #222;padding:12px}
.composer{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.inputWrap{flex:1;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid #333}
.inputWrap input{flex:1;background:transparent;border:0;outline:0;color:#fff}
#micBtn{width:54px;height:54px;border-radius:50%;background:#1f1f1f;border:1px solid #333;color:#fff;display:grid;place-items:center;cursor:pointer}
#micBtn.on{background:#ef4444;border-color:#ef4444}
#micBtn.muted{background:#3f3f46;opacity:.6}
button.icon{width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:#000;display:grid;place-items:center}
</style>
</head>
<body>
<header>
  <div style="font-weight:600">CronyGO Voice Final v3 <span style="color:#22c55e;font-size:11px">Echo防止 + 連続除去</span></div>
  <div id="status"><span id="dot" class="dot"></span><span id="statusText">待機中</span></div>
  <div style="font-size:10px;color:#52525b;margin-top:6px;line-height:1.5">
    ①マイクエコー防止: AI回答中は認識を完全停止 / ②単語連続なし: 同じ言葉の連続を自動除去<br>
    例: こんにちはこんにちは → こんにちは / ありがとう ありがとう ありがとう → ありがとう
  </div>
</header>
<main>
  <div id="chat"><div class="msg ai">v3完成形。2つの大事な処理入り。マイク1回で永遠会話、AIの声は拾いません、同じ言葉の連続も自動で消えます。</div></div>
  <div id="transcriptBox">認識待機中...</div>
</main>
<footer>
  <div class="composer">
    <div class="inputWrap"><input id="inputEl" placeholder="自動入力されます..."><button class="icon" id="sendBtn">↑</button></div>
    <button id="micBtn">●</button>
  </div>
</footer>

<script>
// ==============================
// ① 単語連続なし処理 (大事1)
// ==============================
function removeConsecutiveDuplicates(text){
  if(!text || text.length < 2) return text;
  let t = text.trim();

  // パターンA: スペース区切りの連続 (ありがとう ありがとう) -> ありがとう
  // 日本語でもスペースが入ることがあるので対応
  t = t.replace(/(\S+)(?:\s+\1)+/g, '$1');

  // パターンB: 日本語の塊の連続 (こんにちはこんにちは) -> こんにちは
  // 末尾で同じ文字列が2回連続してたら1回削る、を繰り返す
  let changed = true;
  while(changed){
    changed = false;
    const maxLen = Math.min(20, Math.floor(t.length/2));
    for(let len = maxLen; len >= 1; len--){
      const a = t.slice(-2*len, -len);
      const b = t.slice(-len);
      if(a && a === b){
        t = t.slice(0, -len);
        changed = true;
        break;
      }
    }
  }
  // パターンC: 1文字の連続 (ああああ) -> ああ (2回までに抑える)
  t = t.replace(/(.)\1{2,}/g, '$1$1');

  return t;
}

function dedupFinalAccumulation(finalText, newChunk){
  if(!newChunk) return finalText;
  // 同じfinalが2回来たら無視 (continuousの定番バグ対策)
  if(finalText.endsWith(newChunk)) return finalText;
  newChunk = removeConsecutiveDuplicates(newChunk);
  let combined = finalText + newChunk;
  combined = removeConsecutiveDuplicates(combined);
  return combined;
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const statusText=document.getElementById('statusText'), dot=document.getElementById('dot');
const inputEl=document.getElementById('inputEl'), micBtn=document.getElementById('micBtn'), sendBtn=document.getElementById('sendBtn');
const chat=document.getElementById('chat'), transcriptBox=document.getElementById('transcriptBox');

let recognition=null, isListening=false, isSpeaking=false, wasListeningBeforeSpeak=false;
let finalText='', lastSentText='';

function setStatus(t, cls){ statusText.textContent=t; dot.className='dot'+(cls?' '+cls:''); }
function addMsg(t,r){ const d=document.createElement('div'); d.className='msg '+r; d.textContent=t; chat.appendChild(d); window.scrollTo(0,document.body.scrollHeight); }

function sendMessage(){
  const text=inputEl.value.trim();
  if(!text || text===lastSentText){ inputEl.value=''; return; }
  lastSentText=text;
  addMsg(text,'user');
  inputEl.value=''; finalText=''; transcriptBox.textContent='送信しました...';

  // ==============================
  // ② マイクエコー防止処理 (大事2)
  // ==============================
  wasListeningBeforeSpeak = isListening;
  if(isListening && recognition){
    isSpeaking = true; // このフラグで onresult を完全にブロック
    isListening = false;
    micBtn.classList.remove('on');
    micBtn.classList.add('muted');
    setStatus('AIが話しています... マイク一時OFF (エコー防止)', 'speak');
    try{ recognition.stop(); }catch{}
  }

  setTimeout(()=>{
    const reply='こんにちは、音声テストです。聞こえていますよ！';
    addMsg(reply,'ai');
    const uttr=new SpeechSynthesisUtterance(reply);
    uttr.lang='ja-JP'; uttr.rate=1.1;
    uttr.onstart=()=>{ isSpeaking=true; };
    uttr.onend=()=>{
      isSpeaking=false;
      micBtn.classList.remove('muted');
      if(wasListeningBeforeSpeak){
        isListening=true;
        micBtn.classList.add('on');
        setStatus('待機中... 喋ってください', 'on');
        setTimeout(()=>{ try{ recognition.start(); }catch{} }, 400);
      }else{
        setStatus('停止中','');
      }
    };
    uttr.onerror=()=>{ isSpeaking=false; if(wasListeningBeforeSpeak){ isListening=true; micBtn.classList.add('on'); try{ recognition.start(); }catch{} } };
    speechSynthesis.cancel();
    speechSynthesis.speak(uttr);
  }, 300);
}

function initRecognition(){
  if(!SpeechRecognition){ setStatus('非対応 (Chrome推奨)',''); return null; }
  const rec=new SpeechRecognition();
  rec.lang='ja-JP'; rec.continuous=true; rec.interimResults=true;

  rec.onstart=()=>{ if(!isSpeaking) setStatus('聞いています... (永遠モード)', 'hear'); };

  rec.onresult=(event)=>{
    // ★エコー防止: AIが喋ってる間は文字起こししない
    if(isSpeaking) return;

    let interim='';
    for(let i=event.resultIndex; i<event.results.length; i++){
      const result=event.results[i];
      const transcript=result[0].transcript;
      if(result.isFinal){
        const before=finalText;
        finalText=dedupFinalAccumulation(finalText, transcript.trim());
        if(finalText!==before){
          transcriptBox.textContent=finalText;
          inputEl.value=finalText;
          if(finalText.length>1){
            setTimeout(()=>{ if(inputEl.value===finalText && !isSpeaking) sendMessage(); }, 800);
          }
        }
      }else{
        interim+=transcript;
      }
    }
    if(interim && !isSpeaking){
      transcriptBox.innerHTML=finalText+`<span style="color:#71717a;font-style:italic">${removeConsecutiveDuplicates(interim)}</span>`;
    }
  };

  rec.onend=()=>{
    if(isSpeaking) return; // AI会話中は再開しない
    if(isListening){
      setStatus('再接続中...','on');
      setTimeout(()=>{ if(isListening && !isSpeaking) try{ rec.start(); }catch{} }, 300);
    }else{
      setStatus('停止中','');
    }
  };
  rec.onerror=(e)=>{
    if(e.error==='not-allowed'){ setStatus('マイク許可必要',''); isListening=false; micBtn.classList.remove('on'); }
    else if(!isSpeaking && isListening){ setStatus('再接続中...','on'); setTimeout(()=>{ try{ rec.start(); }catch{} }, 800); }
  };
  return rec;
}

micBtn.addEventListener('click', async ()=>{
  if(!recognition) recognition=initRecognition();
  if(isListening){
    isListening=false; isSpeaking=false; micBtn.classList.remove('on','muted');
    try{ recognition.stop(); }catch{} setStatus('停止中','');
  }else{
    try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }catch(e){ alert('マイク許可必要: '+e.message); return; }
    isListening=true; isSpeaking=false; micBtn.classList.add('on'); finalText=''; lastSentText='';
    try{ recognition.start(); }catch{ setTimeout(()=>{ try{ recognition.start(); }catch{} },200); }
  }
});
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendMessage(); } });
recognition=initRecognition();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
